{% extends "base.html" %}

{% block lab %}Лабораторная работа 7{% endblock %}

{% block script %}
<script src="{{ url_for('static', filename='lab7/main.js') }}"></script>
<style>
    table {
        border-collapse: collapse;
        width: 100%;
        margin: 20px 0;
    }
    
    table th, table td {
        border: 2px solid #ddd;
        padding: 8px;
        text-align: left;
    }
    
    table th {
        background-color: #f2f2f2;
        font-weight: bold;
    }
    
    table tr:hover {
        background-color: #f5f5f5;
    }
    
    button {
        padding: 4px 8px;
        margin: 2px;
        font-size: 12px;
        border-radius: 3px;
        cursor: pointer;
    }
</style>
{% endblock %}

{% block main %}
    <h1>Список фильмов</h1>

    <table>
        <thead>
            <tr>
                <th>Название (рус)</th>
                <th>Название (англ)</th>
                <th>Год</th>
                <th>Действие</th>
            </tr>
        </thead>
        <tbody id="film-list"></tbody>
    </table>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fillFilmList();
        });
    </script>

    <div>
        <button onclick="addFilm()">Добавить фильм</button>
    </div>

{% endblock %}
