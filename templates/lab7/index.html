{% extends "base.html" %}

{% block lab %}Лабораторная работа 7{% endblock %}

{% block script %}
<script src="{{ url_for('static', filename='lab7/main.js') }}"></script>
<style>
    .modal {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        z-index: 1000;
        width: 500px;
        max-width: 90%;
        border: 1px solid #ccc;
    }
    
    table {
        width: 100%;
        border-collapse: collapse;
        margin: 20px 0;
        font-family: Arial, sans-serif;
    }
    
    th, td {
        border: 1px solid #ddd;
        padding: 12px;
        text-align: left;
    }
    
    th {
        background-color: #4a6fa5;
        color: white;
        font-weight: bold;
    }
    
    tr:nth-child(even) {
        background-color: #f9f9f9;
    }
    
    tr:hover {
        background-color: #f0f5ff;
    }
    
    button {
        padding: 8px 16px;
        margin: 4px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        transition: background-color 0.3s;
    }
    
    button:hover {
        opacity: 0.9;
    }
    
    button[onclick="addFilm()"] {
        background-color: #4CAF50;
        color: white;
        padding: 10px 20px;
    }
    
    button[onclick="sendFilm()"] {
        background-color: #4a6fa5;
        color: white;
    }
    
    button[onclick="cancel()"] {
        background-color: #f44336;
        color: white;
    }
    
    .error {
        color: #d32f2f;
        font-size: 13px;
        margin-top: 5px;
        font-weight: bold;
    }
    
    label {
        display: block;
        margin-bottom: 15px;
        font-weight: bold;
        color: #333;
    }
    
    input[type="text"],
    input[type="number"],
    textarea {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: 2px solid #ddd;
        border-radius: 5px;
        font-size: 14px;
        box-sizing: border-box;
    }
    
    textarea {
        height: 100px;
        resize: vertical;
    }
    
    input[type="text"]:focus,
    input[type="number"]:focus,
    textarea:focus {
        border-color: #4a6fa5;
        outline: none;
    }
    
    h1 {
        color: #4a6fa5;
        margin-bottom: 20px;
    }
    
    .actions button {
        padding: 6px 12px;
        font-size: 13px;
    }
    
    .actions button:nth-child(1) {
        background-color: #ff9800;
        color: white;
    }
    
    .actions button:nth-child(2) {
        background-color: #f44336;
        color: white;
    }
    
    .original-title {
        font-style: italic;
        color: #666;
    }
</style>
{% endblock %}

{% block main %}
    <h1>Список фильмов</h1>

    <table>
        <thead>
            <tr>
                <th>Название (рус)</th>
                <th>Название (оригинал)</th>
                <th>Год</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="film-list"></tbody>
    </table>

    <div style="text-align: center; margin-top: 30px;">
        <button onclick="addFilm()">Добавить фильм</button>
    </div>

    <div class="modal">
        <input type="hidden" id="id">
        
        <label>
            Название фильма на русском:
            <input type="text" id="title-ru">
            <span id="title-ru-error" class="error"></span>
        </label>

        <label>
            Название фильма на оригинальном языке:
            <input type="text" id="title">
            <span id="title-error" class="error"></span>
        </label>

        <label>
            Год выпуска:
            <input type="number" id="year">
            <span id="year-error" class="error"></span>
        </label>

        <label>
            Описание:
            <textarea id="description"></textarea>
            <span id="description-error" class="error"></span>
        </label>

        <div style="text-align: right; margin-top: 25px;">
            <button onclick="sendFilm()">Сохранить</button>
            <button onclick="cancel()">Отмена</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fillFilmList();
        });
    </script>
{% endblock %}
