{% extends "base.html" %}

{% block lab %}Лабораторная работа 7{% endblock %}

{% block script %}
<script src="{{ url_for('static', filename='lab7/main.js') }}"></script>
<style>
    .modal {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2), 0 6px 20px 0 rgba(0,0,0,0.19);
        z-index: 1000;
        width: 80%;
        max-width: 500px;
    }
    table {
        border-collapse: collapse;
        width: 100%;
        margin: 20px 0;
    }
    
    table th, table td {
        border: 2px solid #ddd;
        padding: 8px;
        text-align: left;
    }
    
    table th {
        background-color: #f2f2f2;
        font-weight: bold;
    }
    
    table tr:hover {
        background-color: #f5f5f5;
    }
    
    button {
        padding: 4px 8px;
        margin: 2px;
        font-size: 12px;
        border-radius: 3px;
        cursor: pointer;
    }
    
    .error {
        color: red;
        font-size: 12px;
        margin-top: 5px;
    }
</style>
{% endblock %}

{% block main %}
    <h1>Список фильмов</h1>

    <table>
        <thead>
            <tr>
                <th>Название (рус)</th>
                <th>Название (англ)</th>
                <th>Год</th>
                <th>Действие</th>
            </tr>
        </thead>
        <tbody id="film-list"></tbody>
    </table>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fillFilmList();
        });
    </script>

    <div>
        <button onclick="addFilm()">Добавить фильм</button>
    </div>

    <div class="modal">
        <input type="hidden" id="id">
        <label>
            Название фильма на русском:
            <input type="text" id="title-ru">
            <span id="title-ru-error" class="error"></span>
        </label><br>

        <label>
            Название фильма на оригинальном языке
            <i>(если фильм русский, то оставьте пустым):</i>
            <input type="text" id="title">
            <span id="title-error" class="error"></span>
        </label><br>

        <label>
            Год выпуска:
            <input type="number" id="year">
            <span id="year-error" class="error"></span>
        </label><br>

        <label>
            Описание:
            <textarea id="description"></textarea>
            <span id="description-error" class="error"></span>
        </label><br>

        <button onclick="sendFilm()">OK</button>
        <button onclick="cancel()">Отмена</button>
    </div>
{% endblock %}
