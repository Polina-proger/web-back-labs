{% extends "base.html" %}

{% block lab %}Лабораторная работа 9{% endblock %}

{% block main %}
<style>
    .login-container {
        max-width: 400px;
        margin: 50px auto;
        padding: 30px;
        background: white;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    
    .login-title {
        text-align: center;
        color: #0c2461;
        margin-bottom: 30px;
    }
    
    .form-group {
        margin-bottom: 20px;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 5px;
        color: #333;
        font-weight: bold;
    }
    
    .form-group input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 16px;
    }
    
    .login-btn {
        width: 100%;
        padding: 12px;
        background: #0c2461;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
        transition: background 0.3s;
    }
    
    .login-btn:hover {
        background: #1a3b8b;
    }
    
    .back-btn {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #0c2461;
        text-decoration: none;
    }
    
    .error-message {
        color: #e74c3c;
        text-align: center;
        margin-top: 10px;
    }
    
    .users-info {
        margin-top: 20px;
        padding: 15px;
        background: #f8f9fa;
        border-radius: 5px;
        font-size: 14px;
        color: #666;
    }
</style>

<div class="login-container">
    <h2 class="login-title">🔐 Авторизация</h2>
    
    <div id="error-message" class="error-message"></div>
    
    <div class="form-group">
        <label for="username">Имя пользователя:</label>
        <input type="text" id="username" placeholder="Введите имя пользователя">
    </div>
    
    <div class="form-group">
        <label for="password">Пароль:</label>
        <input type="password" id="password" placeholder="Введите пароль">
    </div>
    
    <button class="login-btn" onclick="performLogin()">Войти</button>
    
    <a href="{{ url_for('lab9.main') }}" class="back-btn">← Вернуться к игре</a>
    
    <div class="users-info">
        <p><strong>Тестовые пользователи:</strong></p>
        <p>• admin / 123</p>
        <p>• user1 / pas1</p>
        <p>• user2 / pas2</p>
    </div>
</div>

<script>
    function performLogin() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorElement = document.getElementById('error-message');
        
        if (!username || !password) {
            errorElement.textContent = 'Пожалуйста, заполните все поля';
            return;
        }
        
        errorElement.textContent = '';
        
        fetch('{{ url_for("lab9.login") }}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ username: username, password: password })
        })
        .then(response => response.json())
        .then(data => {
            if (data.ok) {
                window.location.href = '{{ url_for("lab9.main") }}';
            } else {
                errorElement.textContent = data.msg;
            }
        })
        .catch(error => {
            console.error('Ошибка:', error);
            errorElement.textContent = 'Ошибка при авторизации';
        });
    }
    
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            performLogin();
        }
    });
</script>
{% endblock %}
